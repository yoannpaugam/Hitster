/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(5,3,9,.78);display:flex;align-items:flex-end;z-index:20}

  padding:12px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center;border:1px solid var(--line)}

<body>
<div id="app"></div>
<div id="playerbar" hidden>
  <div id="embed"></div>
  <div class="mask"><b>🎵 Musique mystère</b><span>Si rien ne joue, touche ▶ juste ici →</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js"></script>
<script src="songs.js?v=18"></script>
<script>
"use strict";
/* ================= Utilitaires ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("ch_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ch_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("ch_" + k); } catch {} }
};
const COIN = '<span class="coin" aria-label="jeton"></span>';
const coinify = h => String(h).replace(/🪙/g, COIN);
function toast(msg, ms = 2800) {
  const old = $(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = coinify(esc(msg));
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// [film, année, compositeur, morceau, titre original, niveau "F"/"M", id Spotify optionnel]
const SONG = SONGS.map((s, i) => ({ id: i, film: s[0], year: s[1], composer: s[2], track: s[3], orig: s[4] || s[0],
  level: s[5] === "F" ? "facile" : "moyen", sid: s[6] || "" }));
if (!SONG.some(s => s.level === "facile")) setTimeout(() => toast("Liste des musiques pas à jour (songs.js) : recharge la page."), 800);
const songKey = s => s.orig + "|" + s.track;
// Le jeu peut tourner sans connexion Spotify si le morceau a déjà son identifiant dans songs.js (lecteur intégré)
const needsLogin = s => playMode() === "connect" || !(s.sid || (LS.get("ids2", {}) || {})[songKey(s)]);
const allReady = () => playMode() === "embed" && SONG.every(s => s.sid);
const LEVELS = { facile: "Facile", moyen: "Moyen", difficile: "Difficile" };

/* ================= Spotify : connexion (PKCE) ================= */
const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = "user-read-playback-state user-modify-playback-state";
const APP_VERSION = "24 (texte réponse)";
const DEFAULT_CLIENT_ID = "20cb0a147708421b9f7d5d0bf27c9e6a";
const clientId = () => (LS.get("clientId", "") || DEFAULT_CLIENT_ID).trim();

function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randStr(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); }

async function login() {
  if (!clientId()) { toast("Ajoute d'abord ton Client ID Spotify dans les réglages."); return go("settings"); }
  const verifier = randStr(64);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = randStr(16);
  LS.set("pkce", { verifier, state });
  const p = new URLSearchParams({ client_id: clientId(), response_type: "code", redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256", code_challenge: challenge, scope: SCOPES, state });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
function logout() { LS.del("tok"); render(); }
const isLogged = () => !!LS.get("tok", null);

async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  if (!code && !err) return;
  history.replaceState(null, "", REDIRECT_URI);
  if (err) { toast("Connexion Spotify refusée (" + err + ")."); return; }
  const pk = LS.get("pkce", null);
  if (!pk || pk.state !== q.get("state")) { toast("Connexion expirée, réessaie."); return; }
  const body = new URLSearchParams({ grant_type: "authorization_code", code, redirect_uri: REDIRECT_URI,
    client_id: clientId(), code_verifier: pk.verifier });
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
    const j = await r.json();
    if (!r.ok) { toast("Erreur Spotify : " + (j.error_description || j.error)); return; }
    saveToken(j); LS.del("pkce"); toast("Connecté à Spotify ✓");
  } catch { toast("Impossible de joindre Spotify."); }
}
function saveToken(j) {
  const old = LS.get("tok", {}) || {};
  LS.set("tok", { access: j.access_token, refresh: j.refresh_token || old.refresh, exp: Date.now() + (j.expires_in - 60) * 1000 });
}
async function getToken() {
  const t = LS.get("tok", null); if (!t) return null;
  if (Date.now() < t.exp) return t.access;
  if (!t.refresh) return null;
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: t.refresh, client_id: clientId() }) });
    if (!r.ok) { LS.del("tok"); return null; }
    saveToken(await r.json()); return LS.get("tok").access;
  } catch { return null; }
}
class AuthError extends Error {}
async function api(path, opts = {}, tries = 0) {
  const tok = await getToken();
  if (!tok) throw new AuthError();
  const r = await fetch("https://api.spotify.com/v1" + path, { ...opts,
    headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { LS.del("tok"); throw new AuthError(); }
  if (r.status === 429 && tries < 3) { await sleep((+r.headers.get("Retry-After") || 2) * 1000); return api(path, opts, tries + 1); }
  return r;
}

/* ================= Spotify : trouver le morceau ================= */
function lastName(c) { const first = c.split(/&| et | and |,/)[0].trim().split(" "); return first[first.length - 1]; }
async function resolveSong(s) {
  if (s.sid) return "spotify:track:" + s.sid;
  const cache = LS.get("ids2", {}), key = songKey(s);
  if (cache[key]) return cache[key];
  const ln = norm(lastName(s.composer)), tn = norm(s.track), fn = norm(s.orig);
  const queries = [`${s.track} ${s.orig}`, `${s.track} ${lastName(s.composer)}`, `${s.orig} ${lastName(s.composer)}`];
  let best = null, bestScore = 0;
  for (const q of queries) {
    const r = await api("/search?type=track&limit=10&q=" + encodeURIComponent(q));
    if (!r.ok) continue;
    const items = ((await r.json()).tracks || {}).items || [];
    for (const t of items) {
      if (!t) continue;
      const name = norm(t.name), album = norm(t.album && t.album.name || "");
      let sc = 0;
      if (t.artists.some(a => norm(a.name).includes(ln))) sc += 2;
      if (name.includes(tn) || (name.length > 3 && tn.includes(name))) sc += 3;
      if (fn && album.includes(fn)) sc += 1;
      if (sc > bestScore) { bestScore = sc; best = t; }
    }
    if (bestScore >= 5) break;
  }
  if (!best || bestScore < 2) return null;
  const uri = best.uri;
  cache[key] = uri; LS.set("ids2", cache);
  return uri;
}

/* ================= Spotify : lecture ================= */
async function listDevices() {
  const r = await api("/me/player/devices");
  if (!r.ok) return [];
  return (await r.json()).devices || [];
}
let lastPlayError = "", lastDevice = "", lastPlayState = "";
async function getPlayback() {
  try { const r = await api("/me/player"); if (r.status !== 200) return null; return await r.json(); } catch { return null; }
}
async function playUri(uri) {
  const body = JSON.stringify({ uris: [uri], position_ms: (LS.get("startAt", 0) || 0) * 1000 });
  const tryPlay = async id => {
    const r = await api("/me/player/play" + (id ? "?device_id=" + encodeURIComponent(id) : ""), { method: "PUT", body });
    if (!r.ok) { try { const j = await r.json(); lastPlayError = r.status + " " + ((j.error && (j.error.reason || j.error.message)) || ""); } catch { lastPlayError = String(r.status); } }
    return r;
  };
  const devs = await listDevices();
  const pref = LS.get("device", "");
  const dev = devs.find(d => d.id === pref) || devs.find(d => d.is_active) ||
    devs.find(d => d.type === "Smartphone") || devs.find(d => d.type === "Computer") || devs[0];
  if (!dev) {
    // aucun appareil listé : on tente quand même sur l'appareil actif
    const r = await tryPlay("");
    lastDevice = "appareil actif";
    return r.ok ? "ok" : (r.status === 403 ? "premium" : "nodevice");
  }
  if (!dev.is_active) {
    // « réveille » l'appareil en lui transférant la lecture
    try { await api("/me/player", { method: "PUT", body: JSON.stringify({ device_ids: [dev.id], play: false }) }); } catch {}
    await sleep(700);
  }
  let r = await tryPlay(dev.id);
  if (!r.ok && r.status !== 403) { await sleep(1200); r = await tryPlay(dev.id); }
  if (r.ok) {
    lastDevice = dev.name + (dev.type ? " (" + dev.type + ")" : "");
    // Vérifie que Spotify joue vraiment ; sinon relance la lecture
    for (let k = 0; k < 3; k++) {
      await sleep(1500);
      const st = await getPlayback();
      if (st && st.is_playing && st.item && st.item.uri === uri) return "ok";
      if (st && st.item && st.item.uri === uri && !st.is_playing) {
        await api("/me/player/play?device_id=" + encodeURIComponent(dev.id), { method: "PUT" });
      } else {
        await tryPlay(dev.id);
      }
    }
    const st = await getPlayback();
    if (st && st.is_playing && st.item && st.item.uri === uri) return "ok";
    lastPlayState = !st ? "aucun état" : !st.item ? "rien de chargé" : st.item.uri !== uri ? "un autre titre est chargé" : "titre chargé mais en pause";
    return "silent";
  }
  return r.status === 403 ? "premium" : "nodevice";
}

async function getEmbed(uri) {
  if (EmbedCtl) return { c: EmbedCtl, fresh: false };
  const API = await Promise.race([embedApi, sleep(8000).then(() => null)]);
  if (!API) throw new Error("embed-api");
  return new Promise(res => {
    API.createController($("#embed"), { uri, width: "100%", height: 80 }, c => {

      c.addListener("ready", () => { const w = readyWaiters; readyWaiters = []; w.forEach(f => f()); });

}

async function runDiagnostic() {
  const lines = [];
  const add = (ok, t) => lines.push((ok ? "✅ " : "❌ ") + t);
  const ua = navigator.userAgent;
  lines.push("Appareil : " + (/iPhone|iPad/.test(ua) ? "iPhone/iPad" : /Android/.test(ua) ? "Android" : "autre") +
    (window.navigator.standalone ? " (icône écran d'accueil)" : ""));
  lines.push("Version du jeu : " + APP_VERSION);
  lines.push("Client ID : " + clientId().slice(0, 6) + "…");
  lines.push("Redirect URI : " + REDIRECT_URI);
  const tok = await getToken();
  add(!!tok, tok ? "Connecté à Spotify" : "Pas connecté (ou session expirée) → Réglages → Connexion");
  if (!tok) return lines.join("\n");
  const call = async (label, path, opts) => {
    try {
      const r = await fetch("https://api.spotify.com/v1" + path, { ...opts, headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" } });
      let txt = ""; try { txt = await r.text(); } catch {}
      let j = null; try { j = JSON.parse(txt); } catch {}
      return { r, j, txt };
    } catch (e) { return { r: { ok: false, status: "réseau" }, j: null, txt: String(e) }; }
  };
  const errOf = x => x.j && x.j.error ? (x.j.error.reason || x.j.error.message || "") : (x.txt || "").slice(0, 120);
  let x = await call("me", "/me");
  add(x.r.ok, "Compte : HTTP " + x.r.status + (x.r.ok ? (x.j && x.j.product ? " · abonnement " + x.j.product : "") : " · " + errOf(x)));
  x = await call("devices", "/me/player/devices");
  const devs = (x.j && x.j.devices) || [];
  add(x.r.ok && devs.length > 0, "Appareils : HTTP " + x.r.status + " · " +
    (devs.length ? devs.map(d => d.name + " [" + d.type + (d.is_active ? ", actif" : "") + (d.is_restricted ? ", bloqué" : "") + "]").join(", ") : (x.r.ok ? "aucun appareil visible" : errOf(x))));
  x = await call("player", "/me/player");
  add(x.r.ok, "Lecteur : HTTP " + x.r.status + (x.j && x.j.device ? " · " + x.j.device.name + (x.j.is_playing ? " (en lecture)" : " (en pause)") : x.r.status === 204 ? " · rien en cours" : ""));
  x = await call("search", "/search?type=track&limit=1&q=" + encodeURIComponent("Gabriel's Oboe Morricone"));
  const tr = x.j && x.j.tracks && x.j.tracks.items && x.j.tracks.items[0];
  add(x.r.ok && !!tr, "Recherche : HTTP " + x.r.status + (tr ? " · trouvé " + tr.name : " · " + errOf(x)));
  if (tr) {
    const dev = devs.find(d => d.is_active) || devs[0];
    x = await call("play", "/me/player/play" + (dev ? "?device_id=" + encodeURIComponent(dev.id) : ""), { method: "PUT", body: JSON.stringify({ uris: [tr.uri] }) });
    add(x.r.ok, "Test de lecture" + (dev ? " sur " + dev.name : "") + " : HTTP " + x.r.status + (x.r.ok ? " · ça joue !" : " · " + errOf(x)));
  }
  return lines.join("\n");
}

function newGame(nTeams, target, yMin = YEAR_MIN, yMax = YEAR_MAX, level = "moyen", tokens = 3, names = []) {
  const deck = shuffle(songsIn(yMin, yMax, level).map(s => s.id));
  const players = Array.from({ length: nTeams }, (_, i) => ({ name: cleanName(names[i]) || "Équipe " + (i + 1), cards: [deck.pop()], tokens }));
  G = { players, target, deck, yMin, yMax, level, turn: 0, card: null, phase: "ready", gap: null, result: null, winner: null };
  drawCard(); save();
}
function drawCard() {
  if (!G.deck.length) { G.deck = shuffle(songsIn(G.yMin || YEAR_MIN, G.yMax || YEAR_MAX, G.level || "moyen").map(s => s.id).filter(id => !G.players.some(p => p.cards.includes(id)))); }
  // phase : "ready" (pas encore écouté) → "listen" (musique lancée, choix de la case) → "revealed"
  G.card = G.deck.pop(); G.phase = "ready"; G.gap = null; G.result = null; G.chals = []; G.bonus = false; G.answer = null;
}

/* ================= Multi-appareils (relais MQTT public) ================= */
// L'appareil qui crée la partie est l'arbitre : il applique les actions et diffuse l'état à tous.
const BROKER = () => LS.get("broker", "wss://broker.hivemq.com:8884/mqtt");
let NET = LS.get("net", null);          // { code, role: "host" | "guest" }
let LOBBY = NET && NET.role === "host" ? LS.get("lobby", null) : null; // { devices: { cid: équipe }, opts }
let mq = null, netOnline = false;
const myCid = (() => { let c = LS.get("cid", ""); if (!c) { c = randStr(12); LS.set("cid", c); } return c; })();
const topicOf = t => `cinehits/v1/${NET.code}/${t}`;
const isGuest = () => !!NET && NET.role === "guest";
const isHost = () => !!NET && NET.role === "host";
function myTeam() {
  if (!NET) return null;
  if (NET.role === "host") return 0;
  const t = LOBBY && LOBBY.devices ? LOBBY.devices[myCid] : undefined;
  return t == null ? null : t;
}
const lobbyTeams = () => Object.entries((LOBBY || {}).devices || {})
  .map(([cid, team]) => ({ team, me: cid === myCid, name: lobbyName(cid, team) })).sort((a, b) => a.team - b.team);
const lobbyName = (cid, team) => cleanName(((LOBBY || {}).names || {})[cid]) || "Équipe " + (team + 1);

function netStart() {
  if (mq) { try { mq.end(true); } catch {} mq = null; }
  if (typeof mqtt === "undefined") { toast("Module réseau indisponible : vérifie ta connexion internet puis recharge.", 4500); return; }
  mq = mqtt.connect(BROKER(), {
    clientId: "cinehits_" + myCid + "_" + Math.random().toString(16).slice(2, 6),
    reconnectPeriod: 2000, connectTimeout: 8000, keepalive: 30, clean: true
  });
  mq.on("connect", () => {
    netOnline = true;
    mq.subscribe(topicOf(NET.role === "host" ? "act" : "state"), { qos: 1 });
    if (NET.role === "host") publishState(); else sendAct({ t: "join" });
    refreshNet();
  });
  const off = () => { if (netOnline) { netOnline = false; refreshNet(); } };
  mq.on("close", off); mq.on("offline", off);
  mq.on("message", (t, buf) => {
    const txt = buf.toString(); if (!txt) { if (isGuest()) onState(null); return; }
    let m; try { m = JSON.parse(txt); } catch { return; }
    if (NET.role === "host") onAct(m); else onState(m);
  });
}
function refreshNet() {
  if (screen === "lobby") return render();
  const d = $("#netdot"); if (d) d.className = "netdot " + (netOnline ? "on" : "");
}
function publishState() {
  if (!mq || !isHost()) return;
  mq.publish(topicOf("state"), JSON.stringify({ lobby: LOBBY, G, ts: Date.now() }), { qos: 1, retain: true });
}
function sendAct(a) {
  if (!mq) return;
  a.cid = myCid;
  mq.publish(topicOf("act"), JSON.stringify(a), { qos: 1 });
}
function createMulti(opts) {
  if (mq) { try { mq.end(true); } catch {} mq = null; }
  NET = { code: String(Math.floor(10000 + Math.random() * 90000)), role: "host" };
  LOBBY = { devices: { [myCid]: 0 }, opts };
  G = null; LS.del("game"); LS.set("net", NET); LS.set("lobby", LOBBY);
  go("lobby"); netStart();
}
function joinMulti(code) {
  if (mq) { try { mq.end(true); } catch {} mq = null; }
  NET = { code, role: "guest" }; LOBBY = null; G = null; LS.set("net", NET);
  go("lobby"); netStart();
  setTimeout(() => { if (NET && NET.code === code && !LOBBY) toast("Aucune partie trouvée avec ce code pour l'instant… Vérifie le code.", 4500); }, 7000);
}
function leaveMulti(msg) {
  if (mq) {
    try {
      if (isHost()) mq.publish(topicOf("state"), "", { qos: 1, retain: true });
      else sendAct({ t: "leave" });
    } catch {}
    const c = mq; mq = null; setTimeout(() => { try { c.end(true); } catch {} }, 600);
  }
  pause(); showBar(false); closeSheet();
  NET = null; LOBBY = null; netOnline = false; LS.del("net"); LS.del("lobby");
  G = LS.get("game", null); if (G && G.multi) { G = null; LS.del("game"); }
  pickTeam = null; if (msg) toast(msg, 4000);
  go("home");
}
function renumberLobby() {
  const list = Object.entries(LOBBY.devices).sort((a, b) => a[1] - b[1]);
  list.forEach(([cid], i) => { LOBBY.devices[cid] = i; });
}
function onAct(a) {
  if (!a || !a.cid) return;
  if (a.t === "join") {
    if (LOBBY.devices[a.cid] == null && !G) {
      const n = Object.keys(LOBBY.devices).length;
      if (n < 8) LOBBY.devices[a.cid] = n;
    }
    LS.set("lobby", LOBBY); publishState(); if (screen === "lobby") render();
    return;
  }
  if (a.t === "name") {
    LOBBY.names = LOBBY.names || {}; LOBBY.names[a.cid] = cleanName(a.name);
    LS.set("lobby", LOBBY); publishState(); if (screen === "lobby") render();
    return;
  }
  if (a.t === "leave") {
    if (!G && LOBBY.devices[a.cid] != null && a.cid !== myCid) { delete LOBBY.devices[a.cid]; renumberLobby(); }
    LS.set("lobby", LOBBY); publishState(); if (screen === "lobby") render();
    return;
  }
  const by = LOBBY.devices[a.cid];
  if (by == null || !G) return;
  a.by = by;
  const prev = JSON.parse(JSON.stringify(G));
  if (applyAction(a)) afterChange(prev);
}
function onState(m) {
  if (!m || !m.lobby) { if (LOBBY) leaveMulti("La partie a été terminée par son créateur."); return; }
  const prev = G;
  LOBBY = m.lobby; G = m.G;
  if (!G) { pickTeam = null; if (screen !== "lobby") screen = "lobby"; render(); return; }
  if (myTeam() == null) { leaveMulti("Cette partie a déjà commencé sans toi."); return; }
  if (G.ended) { leaveMulti("Le créateur a terminé la partie."); return; }
  postState(prev);
}
function startMulti() {
  const o = LOBBY.opts, n = Object.keys(LOBBY.devices).length, names = [];
  Object.entries(LOBBY.devices).forEach(([cid, team]) => { names[team] = lobbyName(cid, team); });
  newGame(n, o.target, o.yMin, o.yMax, o.level, o.tokens, names);
  G.multi = true; G.remote = !!o.remote; G.playSeq = 0;
  const prev = null; afterChange(prev);
}

/* ================= Actions de jeu (identiques en local et à plusieurs) ================= */
let pickTeam = null;      // équipe en train de choisir sa case de vote (sur cet appareil)
let shownSeq = null;      // dernier résultat affiché dans la fenêtre
let wantPlayNext = false; // relancer la lecture quand la nouvelle carte arrive
let lastPlaySeq = null;   // dernière lecture diffusée (parties à distance)
function ensureG() {
  if (!G) return;
  if (!Array.isArray(G.chals)) G.chals = [];
  delete G.picking;
}
const activeHere = () => !!G && (!G.multi || myTeam() === G.turn);
function dispatch(a) {
  if (!G) return;
  if (isGuest()) { sendAct(a); return; }
  a.by = myTeam();
  const prev = JSON.parse(JSON.stringify(G));
  if (applyAction(a)) afterChange(prev);
}
function afterChange(prev) {
  save();
  if (isHost()) publishState();
  postState(prev);
}
function postState(prev) {
  ensureG();
  if (G.winner != null) { pause(); showBar(false); }
  const newCard = !prev || prev.card !== G.card;
  if (newCard) {
    pickTeam = null; tlScroll = 0; statusMsg = "";
    if (prev) pause();
    if (prev && G.winner == null && (prev.turn !== G.turn)) {
      toast(G.multi && myTeam() === G.turn ? "🎧 C'est au tour de ton équipe !" : "À " + cur().name + " de jouer !");
      if (G.multi && myTeam() === G.turn && navigator.vibrate) navigator.vibrate([60, 60, 60]);
    }
  }
  if (G.phase !== "vote") pickTeam = null;
  ensureEmbedTrack();
  if (["home", "lobby", "join", "setup"].includes(screen)) screen = "game";
  render();
  if (newCard && wantPlayNext) { wantPlayNext = false; if (activeHere()) playCurrent(); }
  if (G.multi && G.remote && !activeHere()) {
    if (!prev || lastPlaySeq == null) lastPlaySeq = G.playSeq;
    else if (G.playSeq !== lastPlaySeq) { lastPlaySeq = G.playSeq; if (G.phase === "listen") playCurrent(); }
  } else lastPlaySeq = G.playSeq;
  if (G.phase === "revealed" && G.resultSeq !== shownSeq) {
    shownSeq = G.resultSeq;
    if (prev && prev.phase !== "revealed") {
      showResult();
      if (navigator.vibrate) navigator.vibrate(G.result && G.result.ok ? 60 : [40, 60, 40]);
    }
  }
}
function applyAction(a) {
  if (!G) return false;
  ensureG();
  const multi = !!G.multi, active = !multi || a.by === G.turn;
  switch (a.t) {
    case "play": if (!active || G.phase !== "ready") return false; G.phase = "listen"; G.playSeq = (G.playSeq || 0) + 1; return true;
    case "replay": if (!active || !["listen", "vote"].includes(G.phase)) return false; G.playSeq = (G.playSeq || 0) + 1; return true;
    case "redraw": if (!active) return false; drawCard(); G.phase = "listen"; G.playSeq = (G.playSeq || 0) + 1; return true;
    case "gap": if (!active || G.phase !== "listen") return false; G.gap = a.i; return true;
    case "answer": {
      if (!active || G.phase !== "listen" || G.gap == null) return false;
      G.answer = { film: String(a.film || "").slice(0, 80), composer: String(a.composer || "").slice(0, 80) };
      G.phase = "vote"; G.chals = [];
      return true;
    }
    case "vote": {
      const team = multi ? a.by : a.team;
      if (G.phase !== "vote" || team == null || team === G.turn) return false;
      const pl = G.players[team];
      if (!pl || (pl.tokens || 0) <= 0 || G.chals.some(c => c.team === team)) return false;
      const used = [G.gap, ...G.chals.map(c => c.gap)];
      if (a.gap == null || used.includes(a.gap) || a.gap < 0 || a.gap > cur().cards.length) return false;
      G.chals.push({ team, gap: a.gap }); return true;

/* ---------- Correction tolérante des propositions ---------- */
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const row = [i];
    for (let j = 1; j <= n; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = row;
  }

}
const STOP = new Set(["le", "la", "les", "l", "un", "une", "des", "de", "du", "d", "the", "a", "an", "of", "et", "and", "chapitre", "partie", "part"]);

}
function filmMatch(guess, s) {
  const g = words(guess).join(" ");
  if (g.replace(/ /g, "").length < 2) return false;
  for (const t of [s.film, s.orig]) {
    const tw = words(t).join(" ");
    if (!tw) continue;
    if (fuzzyEq(g.replace(/ /g, ""), tw.replace(/ /g, ""))) return true;
    const gc = norm(guess).replace(/ /g, ""), tc = norm(t).replace(/ /g, "");
    if (gc === tc || fuzzyEq(gc, tc)) return true; // « lalaland », « lebonlabrute… »
    if (g.length >= Math.min(6, tw.length) && tw.includes(g)) return true; // « Harry Potter », « Seigneur des anneaux »…
    const gw = g.split(" "), tws = tw.split(" ");
    if (gw.join("").length >= 5 && gw.every(w => tws.some(x => x === w || fuzzyEq(w, x)))) return true;
  }
  return false;
}
function composerMatch(guess, s) {
  const gw = words(guess);
  if (!gw.length) return false;
  return s.composer.split(/&| et | and |,/).map(x => x.trim()).filter(Boolean).some(person => {
    const pw = words(person), last = pw[pw.length - 1] || "";
    if (gw.some(w => w === last || fuzzyEq(w, last))) return true;
    return fuzzyEq(gw.join(""), pw.join(""));

}

function resolveTurn() {

  const ans = G.answer || {};

  if (ans.film || ans.composer) {
    lines.push(`${fOk ? "✓" : "✗"} Film proposé : « ${ans.film || "—"} »`);
    lines.push(`${cOk ? "✓" : "✗"} Compositeur proposé : « ${ans.composer || "—"} »`);
  }
  G.bonus = false;
  if (fOk && cOk) { p.tokens = (p.tokens || 0) + 1; G.bonus = true; lines.push(`✓ Film et compositeur trouvés : +1 🪙 pour ${p.name}`); }

      lines.push(`✓ ${c.name} avait voté juste : elle remporte la carte (et utilise son jeton).`);
    } else if (vOk) {
      lines.push(`= ${c.name} avait aussi une bonne case : elle garde son jeton.`);
    } else {
      c.tokens = Math.max(0, (c.tokens || 0) - 1); p.tokens = (p.tokens || 0) + 1;

async function playCurrent() {
  const s = SONG[G.card];
  if (needsLogin(s) && !isLogged()) { setStatus("Ce morceau n'a pas d'identifiant Spotify dans songs.js : refais l'export de la liste (Réglages)."); return; }
  setStatus("");
  try {
    const uri = await resolveSong(s);
    if (G.card !== s.id) return;
    if (!uri) { setStatus("Morceau introuvable sur Spotify — on en tire un autre."); offerFreeSkip(); return; }
    if (playMode() === "embed") {
      setStatus("");
      const ok = await playEmbedded(uri);
      if (G.card !== s.id) return;
      setStatus(ok ? "" : "👉 Touche ▶ à droite du lecteur pour entendre la musique");
      return;
    }
    const res = await playUri(uri);
    if (res === "ok") setStatus("");
    else if (res === "silent") { setStatus("Spotify a reçu le morceau mais ne joue pas (" + lastPlayState + ")."); silentHelp(); }
    else if (res === "premium") setStatus("Spotify refuse la lecture (Premium requis).");
    else { setStatus("Aucun appareil Spotify actif."); noDeviceHelp(); }
  } catch (e) {
    setStatus(e instanceof AuthError ? "Session Spotify expirée : reconnecte-toi dans Réglages." : "Erreur réseau, appuie sur Réécouter.");
  }
}

    <a class="btn sec" href="spotify:" style="text-align:center;text-decoration:none">Ouvrir Spotify</a>
    <button class="btn" id="x_retry">Réessayer</button>
    <button class="btn sec" id="x_dev">🔊 Choisir un autre appareil</button>
    <button class="btn ghost" id="x_fb">Mode secours : ouvrir la musique dans Spotify</button>`,
    { x_retry: () => { closeSheet(); playCurrent(); }, x_dev: () => { closeSheet(); chooseDevice(); }, x_fb: openFallback });
}

async function chooseDevice() {
  let devs = [];
  try { devs = await listDevices(); } catch { toast("Connecte-toi à Spotify."); return; }
  const pref = LS.get("device", "");
  sheet(`<h2>Sur quel appareil jouer ?</h2>
    ${devs.length ? devs.map(d => `<button class="btn ${d.id === pref ? "" : "sec"}" data-dev="${esc(d.id)}" data-name="${esc(d.name)}">🔊 ${esc(d.name)} <span style="opacity:.7">(${esc(d.type)}${d.is_active ? ", actif" : ""})</span></button>`).join("")
      : `<p class="muted">Aucun appareil détecté. Ouvre Spotify sur ton téléphone, lance un titre, puis reviens.</p>`}
    <button class="btn ghost" id="c_auto">Automatique</button>
    <button class="btn ghost" id="c_close">Fermer</button>`, {
    c_close: closeSheet,
    c_auto: () => { LS.del("device"); LS.del("deviceName"); closeSheet(); playCurrent(); }
  });
  document.querySelectorAll("[data-dev]").forEach(b => b.onclick = () => {
    LS.set("device", b.dataset.dev); LS.set("deviceName", b.dataset.name); closeSheet(); playCurrent();
  });
}

async function openFallback() {
  const s = SONG[G.card];
  let uri = null; try { uri = await resolveSong(s); } catch {}
  if (!uri) { toast("Morceau introuvable."); return; }
  if (!confirm("Le titre sera visible dans Spotify. Demande à quelqu'un d'une autre équipe de lancer la musique, ou ne regarde pas l'écran. Continuer ?")) return;
  closeSheet();
  location.href = "https://open.spotify.com/track/" + uri.split(":").pop();
}

function exportSongs() {
  const c = LS.get("ids2", {}) || {};
  let found = 0;
  const rows = SONG.map(s => {
    const raw = SONGS[s.id].slice(0, 6);
    while (raw.length < 6) raw.push(raw.length === 4 ? s.orig : raw.length === 5 ? (s.level === "facile" ? "F" : "M") : "");
    const id = s.sid || (c[songKey(s)] || "").split(":").pop();
    if (id) { found++; raw.push(id); }
    return "  " + JSON.stringify(raw).replace(/","/g, '", "').replace(/",(\d)/g, '", $1').replace(/(\d),"/g, '$1, "') + ",";
  });
  const txt = `// Liste des compositions de films.
// Format : [Titre affiché, Année de sortie du film, Compositeur, Morceau, Titre original, Niveau, ID Spotify]
// Niveau : "F" = Facile · "M" = Moyen (le niveau Difficile reprend toute la liste)
// Pour corriger un morceau : remplace son ID (lien https://open.spotify.com/track/XXXXXXXX -> "XXXXXXXX").
// Règle : au maximum 2 morceaux par film.
const SONGS = [
${rows.join("\n")}
];
`;
  const blob = new Blob([txt], { type: "text/javascript" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "songs.js";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`songs.js exporté : ${found} / ${SONG.length} morceaux avec identifiant.` + (found < SONG.length ? " Les autres demanderont une connexion." : ""), 4500);
}
function showResult() {
  const s = SONG[G.card], r = G.result; if (!r) return;
  const lines = (r.lines || []).map(l => `<div class="rline ${l.startsWith("✓") ? "ok" : l.startsWith("✗") ? "ko" : ""}">${esc(l)}</div>`).join("");
  sheet(`<div class="mystery reveal ${r.ok ? "ok" : "ko"}" style="margin-top:0">
      <div class="year">${s.year}</div><div class="film">${esc(s.film)}</div>
      <div class="track">« ${esc(s.track)} »</div><div class="comp">${esc(s.composer)}</div></div>
    <div class="rlines">${lines}</div>
    <button class="btn" id="r_close">Fermer</button>`, { r_close: closeSheet });
}
/* ---------- Menu & feuilles ---------- */
function sheet(html, handlers = {}) {
  closeSheet();
  const o = document.createElement("div"); o.className = "overlay"; o.id = "ov";
  o.innerHTML = `<div class="sheet">${coinify(html)}</div>`;
  o.onclick = e => { if (e.target === o) closeSheet(); };
  document.body.appendChild(o);
  Object.entries(handlers).forEach(([id, fn]) => { const el = document.getElementById(id); if (el) el.onclick = fn; });
}
function closeSheet() { const o = $("#ov"); if (o) o.remove(); }
function openMenu() {
  const rows = G.players.map((pl, i) => `<div class="score"><span>${i === G.turn ? "🎧 " : ""}<b>${esc(pl.name)}</b>${G.multi && i === myTeam() ? ` <span class="muted">(toi)</span>` : ""}</span>
    <span>${pl.cards.length}/${G.target} cartes · ${pl.tokens || 0} 🪙</span></div>`).join("");
  sheet(`<h2>Scores</h2>${rows}
    <p class="muted">Niveau ${LEVELS[G.level || "moyen"]} · Période : ${G.yMin || YEAR_MIN} – ${G.yMax || YEAR_MAX} · ${G.deck.length} musiques restantes dans la pioche.</p>
    ${G.multi ? `<p class="muted">Partie à plusieurs · code <b>${esc(NET ? NET.code : "")}</b></p>` : ""}
    <button class="btn" id="m_close">Reprendre</button>
    <button class="btn sec" id="m_set">⚙️ Réglages</button>
    <button class="btn ghost" id="m_quit">${!G.multi ? "Abandonner la partie" : isHost() ? "Terminer la partie pour tous" : "Quitter la partie"}</button>`, {
    m_close: closeSheet,
    m_set: () => { closeSheet(); go("settings"); },
    m_quit: () => {
      if (!G.multi) { if (confirm("Abandonner la partie en cours ?")) { closeSheet(); pause(); G = null; LS.del("game"); go("home"); } return; }
      if (isHost()) { if (confirm("Terminer la partie pour toutes les équipes ?")) { dispatch({ t: "end" }); setTimeout(() => leaveMulti(), 400); } return; }
      if (confirm("Quitter la partie ? Ton équipe ne pourra plus jouer.")) leaveMulti();
    }
  });
}

/* ---------- Victoire ---------- */
function viewWin() {
  const w = G.players[G.winner];
  const ranking = [...G.players].sort((a, b) => b.cards.length - a.cards.length)
    .map(pl => `<div class="score"><b>${esc(pl.name)}</b><span>${pl.cards.length} cartes</span></div>`).join("");
  return `<div class="screen win"><div class="trophy">🏆</div><h1>${esc(w.name)}</h1><p class="muted">remporte la partie !</p>
    <div class="content"><div class="box" style="text-align:left">${ranking}</div></div>
    <div class="footer">${!G.multi
      ? `<button class="btn" id="again">Rejouer</button><button class="btn sec" id="home">Accueil</button>`
      : isHost() ? `<button class="btn" id="again">Rejouer avec les mêmes équipes</button><button class="btn sec" id="home">Terminer</button>`
      : `<button class="btn sec" disabled>En attente du créateur…</button><button class="btn ghost" id="home">Quitter</button>`}</div></div>`;
}
function bindWin() {
  if (!G.multi) {
    $("#again").onclick = () => { G = null; LS.del("game"); go("setup"); };
    $("#home").onclick = () => { G = null; LS.del("game"); go("home"); };
    return;
  }
  $("#again") && ($("#again").onclick = () => { G = null; LS.del("game"); LS.set("lobby", LOBBY); publishState(); go("lobby"); });
  $("#home").onclick = () => leaveMulti();
}

/* ================= Démarrage ================= */
(async () => {
  await handleRedirect();
  if (NET) { if (isGuest()) G = null; screen = G ? "game" : "lobby"; render(); netStart(); }
  else render();
})();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
